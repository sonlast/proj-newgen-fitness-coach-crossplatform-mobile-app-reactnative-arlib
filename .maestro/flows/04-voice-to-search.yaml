appId: com.i_son.lastimosa.newgenfitcoach
---
# Test: Voice Recording to Search Navigation
# Description: Tests the complete flow from voice recording to search screen

- launchApp

# Verify home screen
- assertVisible: "TAP TO SPEAK"
- assertVisible:
    id: "home-mic-button"

# Start recording
- tapOn:
    id: "home-mic-button"

# Verify recording state
- assertVisible: "TAP TO STOP"

# Wait a moment (simulating speaking)
- waitForAnimationToEnd

# Stop recording
- tapOn:
    id: "home-mic-button"

# After stopping, the app should process the recording
# Note: In a real scenario, this would navigate to search with transcription
# For testing without actual voice input, we verify the state changes

# Verify we're back to initial state or processing
- assertVisible:
    id: "home-mic-button"

# Alternative: Test direct navigation to search
- tapOn:
    id: "home-search-button"

# Verify search screen
- assertVisible: "Search workout..."
- assertVisible:
    id: "search-input"
