appId: com.i_son.lastimosa.newgenfitcoach
---
# Test: Workout Selection and Modal Display
# Description: Tests selecting a workout and viewing its details in a modal

- launchApp

# Navigate to search screen
- tapOn:
    id: "home-search-button"

# Search for a specific workout
- tapOn:
    id: "search-input"
- inputText: "push"

# Wait for results to load
- assertVisible: "Matched"

# Tap on the first workout result
# Note: This assumes at least one workout matches "push"
- tapOn: "Push"

# Verify modal appears with workout details
# The modal should show workout information
- assertVisible: "Push"

# Wait a moment to view the modal
- waitForAnimationToEnd

# Dismiss the modal by tapping outside or on close button
# This may need adjustment based on your modal implementation
- tapOn:
    point: "50%,10%"

# Verify we're back to search results
- assertVisible: "Search workout..."
